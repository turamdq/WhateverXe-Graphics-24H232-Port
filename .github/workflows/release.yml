name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned dependencies
        run: python3 tools/bootstrap.py
      - name: Build, test and package
        run: python3 tools/build.py --rebuild
      - uses: actions/upload-artifact@v4
        with:
          name: WhateverXe-24H232-Port
          path: target/*
          if-no-files-found: error
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" target/*.pkg target/SHA256SUMS --verify-tag --title "$RELEASE_TAG" --notes-file docs/RELEASE.md
